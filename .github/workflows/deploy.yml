name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Inject TMDb API key
        run: |
          sed -i "s/tmdbApiKey: ''/tmdbApiKey: '${{ secrets.TMDB_API_KEY }}'/" src/environments/environment.prod.ts

      - name: Build
        run: npm run build -- --base-href /cinema-vault/

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/cinema-vault/browser
