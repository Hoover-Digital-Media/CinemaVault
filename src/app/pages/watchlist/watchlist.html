<div class="watchlist-page">
  <h1 class="page-title">My Watchlist</h1>

  @if (watchlist.watchlist().length === 0) {
    <div class="empty-state">
      <p>Your watchlist is empty.</p>
      <a routerLink="/browse" class="browse-link">Browse movies to get started</a>
    </div>
  } @else {
    <p class="count">{{ watchlist.count() }} movie{{ watchlist.count() !== 1 ? 's' : '' }} saved</p>
    <div class="movie-grid">
      @for (movie of watchlist.watchlist(); track movie.id) {
        <app-movie-card [movie]="movie" />
      }
    </div>
  }
</div>
